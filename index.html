<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07101e" />
  <title>Minhas Finanças RENOVA</title>
  <link rel="stylesheet" href="./css/app.css?v=20260913-0015" />
  <link rel="stylesheet" href="./css/accounts-module.css?v=20260913-0015" />
  <link rel="stylesheet" href="./css/transactions-module.css?v=20260913-0015" />
  <link rel="stylesheet" href="./css/payments-module.css?v=20260914-0900" />
  <link rel="stylesheet" href="./css/cards-module.css?v=20260913-0015" />
  <link rel="stylesheet" href="./css/budgets-module.css?v=20260913-0040" />
  <link rel="stylesheet" href="./css/goals-module.css?v=20260913-0081" />
  <link rel="stylesheet" href="./css/theme-brand-module.css?v=20260913-0170" />
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="transactionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="transactionModalTitle">
    <div class="modal-backdrop" data-close-modal></div><div class="modal-card">
      <div class="modal-head"><div><span class="eyebrow">NOVO LANÇAMENTO</span><h2 id="transactionModalTitle">Adicionar movimentação</h2></div><button class="icon-btn" data-close-modal type="button">×</button></div>
      <form id="transactionForm" class="transaction-form">
        <div class="segmented"><button class="active" data-kind="income" type="button">Receita</button><button data-kind="expense" type="button">Despesa</button><button data-kind="transfer" type="button">Transferência</button></div>
        <input id="transactionKind" type="hidden" value="income" />
        <label>Descrição<input id="transactionDescription" type="text" placeholder="Ex.: Salário, mercado, aluguel..." required /></label>
        <div class="form-grid two"><label>Valor<input id="transactionAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required /></label><label>Data<input id="transactionDate" type="date" required /></label></div>
        <div class="form-grid two"><label>Conta<select id="transactionAccount" required><option value="">Selecione</option></select></label><label>Categoria<select id="transactionCategory"><option value="">Sem categoria</option></select></label></div>
        <label id="destinationAccountWrap" class="hidden">Conta de destino<select id="transactionDestinationAccount"><option value="">Selecione</option></select></label>
        <label>Observações<textarea id="transactionNotes" rows="3" placeholder="Opcional"></textarea></label>
        <div class="modal-actions"><button class="ghost-btn" data-close-modal type="button">Cancelar</button><button id="saveTransactionBtn" class="primary-btn" type="submit">Salvar movimentação</button></div>
      </form>
    </div>
  </div>

  <div id="accountModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
    <div class="modal-backdrop" data-close-account-modal></div><div class="modal-card">
      <div class="modal-head"><div><span class="eyebrow">CONTA FINANCEIRA</span><h2 id="accountModalTitle">Nova conta</h2></div><button class="icon-btn" data-close-account-modal type="button">×</button></div>
      <form id="accountForm" class="account-form">
        <label>Nome da conta<input id="accountName" type="text" placeholder="Ex.: Conta principal, banco, carteira..." required /></label>
        <div class="form-grid two"><label>Tipo<select id="accountType"><option value="conta">Conta corrente</option><option value="poupanca">Poupança</option><option value="carteira">Carteira digital</option><option value="dinheiro">Dinheiro</option><option value="investimento">Investimentos</option><option value="outro">Outra conta</option></select></label><label>Saldo inicial<input id="accountInitialBalance" type="number" step="0.01" inputmode="decimal" value="0" required /></label></div>
        <label id="accountActiveWrap" class="account-active-row hidden"><input id="accountActive" type="checkbox" checked /><span>Conta ativa</span></label>
        <p class="account-help">O saldo inicial representa o valor que já existia na conta antes dos lançamentos registrados no RENOVA.</p>
        <div class="account-modal-actions"><button class="ghost-btn" data-close-account-modal type="button">Cancelar</button><button id="saveAccountBtn" class="primary-btn" type="submit">Salvar conta</button></div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/app.js?v=20260913-0015"></script>
  <script type="module" src="./js/accounts-module.js?v=20260913-0015"></script>
  <script type="module" src="./js/transactions-module.js?v=20260913-0015"></script>
  <script type="module" src="./js/payments-module.js?v=20260914-1320"></script>
  <script type="module" src="./js/mercado-pago-oauth-module.js?v=20260914-1320"></script>
  <script type="module" src="./js/cards-module.js?v=20260913-0015"></script>
  <script type="module" src="./js/budgets-module.js?v=20260913-0040"></script>
  <script type="module" src="./js/goals-module.js?v=20260913-0081"></script>
  <script type="module" src="./js/theme-brand-module.js?v=20260913-0170"></script>
</body>
</html>
