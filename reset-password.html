<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Redefinir senha | Minhas Finanças RENOVA</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050b14;color:#eef7ff}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(34,211,238,.12),transparent 35%),radial-gradient(circle at 80% 20%,rgba(99,102,241,.14),transparent 32%),#050b14}.card{width:min(100%,440px);background:rgba(10,22,39,.94);border:1px solid rgba(99,180,255,.16);border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#06101c;background:linear-gradient(135deg,#2dd4bf,#3b82f6 60%,#8b5cf6)}.brand strong{display:block;font-size:14px}.brand span{display:block;font-size:11px;color:#2dd4bf;letter-spacing:.18em}small.kicker{display:block;color:#67e8f9;font-size:11px;font-weight:800;letter-spacing:.16em;margin-bottom:8px}h1{font-size:30px;line-height:1.08;margin:0 0 10px}p{color:#99abc0;line-height:1.55;margin:0 0 22px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:48px;border-radius:12px;border:1px solid #20334d;background:#081522;color:#fff;padding:0 14px;outline:none}.field input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.10)}button{width:100%;height:48px;border:0;border-radius:12px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#2dd4bf,#38bdf8,#3b82f6);color:#04111e}button:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;line-height:1.45}.message.show{display:block}.message.error{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.24);color:#fecaca}.message.ok{background:rgba(45,212,191,.10);border:1px solid rgba(45,212,191,.24);color:#a7f3d0}.back{display:block;text-align:center;margin-top:18px;color:#7dd3fc;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">R</div><div><strong>MINHAS FINANÇAS</strong><span>RENOVA</span></div></div>
    <small class="kicker">SEGURANÇA DA CONTA</small>
    <h1>Crie sua nova senha</h1>
    <p>Defina uma nova senha para voltar ao Minhas Finanças RENOVA.</p>
    <form id="resetForm">
      <div class="field"><label for="password">Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <button id="saveBtn" type="submit">Salvar nova senha</button>
    </form>
    <div id="message" class="message"></div>
    <a class="back" href="https://minhasfinancas.servicosgold.com.br/">Voltar ao Minhas Finanças</a>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './js/config.js';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const form = document.querySelector('#resetForm');
    const button = document.querySelector('#saveBtn');
    const message = document.querySelector('#message');
    const show = (text, type) => { message.textContent = text; message.className = `message show ${type}`; };

    async function checkRecoverySession() {
      await new Promise(resolve => setTimeout(resolve, 250));
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        form.style.display = 'none';
        show('Este link de recuperação é inválido ou expirou. Volte ao Minhas Finanças e solicite um novo e-mail.', 'error');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.querySelector('#password').value;
      const confirm = document.querySelector('#confirmPassword').value;
      if (password.length < 8) return show('Use uma senha com pelo menos 8 caracteres.', 'error');
      if (password !== confirm) return show('As duas senhas não são iguais.', 'error');
      button.disabled = true; button.textContent = 'Salvando...';
      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        button.disabled = false; button.textContent = 'Salvar nova senha';
        return show(error.message, 'error');
      }
      show('Senha atualizada com sucesso. Você será direcionado para entrar novamente.', 'ok');
      await supabase.auth.signOut();
      setTimeout(() => location.href = 'https://minhasfinancas.servicosgold.com.br/', 1800);
    });

    checkRecoverySession();
  </script>
</body>
</html>
